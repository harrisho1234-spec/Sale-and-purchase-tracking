name: Customer SR financial reconciliation tests

on:
  push:
    branches: [main]
    paths:
      - 'customer-sr-financials.js'
      - 'customer-edit.js'
      - 'customer-order-history.js'
      - 'customer-credit-summary.js'
      - 'tracking-redesign.js'
      - 'sales-tracking-legacy-balance-logic.js'
      - 'app.js'
      - 'index.html'
      - 'tests/customer-sr-financials.test.cjs'
      - '.github/workflows/customer-sr-financial-tests.yml'
  workflow_dispatch:

jobs:
  customer-financial-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check modified browser scripts
        run: |
          node --check customer-sr-financials.js
          node --check customer-edit.js
          node --check customer-order-history.js
          node --check customer-credit-summary.js
          node --check tracking-redesign.js
          node --check sales-tracking-legacy-balance-logic.js
          node --check app.js
      - name: Validate customer SR to TK/RK financial totals
        run: node --test tests/customer-sr-financials.test.cjs
