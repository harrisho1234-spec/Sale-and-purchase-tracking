name: Invoice Return AR and Exchange pause checks

on:
  push:
    branches: [main]
    paths:
      - 'sales-returns.js'
      - 'database/20261113_cn_issued_invoice_sources.sql'
      - 'tests/cn-issued-invoice-sources.test.cjs'
      - 'tests/cancel-undelivered-ui.test.cjs'
      - 'tracking-redesign.js'
      - 'cn-ar-preview.js'
      - 'return-credit-workflow.js'
      - 'cn-case-workflow.js'
      - 'tests/cn-ar-preview-and-approval.test.cjs'
      - 'index.html'
      - 'tests/invoice-return-ar-and-exchange-pause.test.cjs'
      - 'tests/invoice-price-breakdown.test.cjs'
      - 'database/20261104_lock_new_exchange_and_show_return_ar.sql'
      - '.github/workflows/invoice-return-ar-exchange-pause.yml'
  workflow_dispatch:

jobs:
  invoice-return-and-exchange-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check affected scripts for syntax
        run: |
          node --check sales-returns.js
          node --check tracking-redesign.js
          node --check cn-ar-preview.js
          node --check return-credit-workflow.js
          node --check cn-case-workflow.js
      - name: Install UI test dependencies
        run: npm install --no-save --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Verify issued-invoice return and uninvoiced SR cancellation interactions
        run: node tests/cancel-undelivered-ui.test.cjs
      - name: Test issued TK/RK return sources and preserved legacy CN mapping
        run: node --test tests/cn-issued-invoice-sources.test.cjs
      - name: Test Return/CN financial breakdown and Exchange lock
        run: node --test tests/invoice-return-ar-and-exchange-pause.test.cjs
      - name: Verify approved CN return AR and excess customer credit preview
        run: node --test tests/cn-ar-preview-and-approval.test.cjs
      - name: Recheck prior invoice pricing view
        run: node --test tests/invoice-price-breakdown.test.cjs
