name: Invoice Return AR and Exchange pause checks

on:
  push:
    branches: [main]
    paths:
      - 'sales-returns.js'
      - 'tracking-redesign.js'
      - 'index.html'
      - 'tests/invoice-return-ar-and-exchange-pause.test.cjs'
      - 'database/20261104_lock_new_exchange_and_show_return_ar.sql'
      - '.github/workflows/invoice-return-ar-exchange-pause.yml'
  workflow_dispatch:

jobs:
  invoice-return-and-exchange-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check affected scripts for syntax
        run: |
          node --check sales-returns.js
          node --check tracking-redesign.js
      - name: Test Return/CN financial breakdown and Exchange lock
        run: node --test tests/invoice-return-ar-and-exchange-pause.test.cjs
      - name: Recheck prior invoice pricing view
        run: node --test tests/invoice-price-breakdown.test.cjs
