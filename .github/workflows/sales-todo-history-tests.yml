name: Sales To-Do revision history regression

on:
  push:
    paths:
      - 'google-apps-script/sales-daily-plan/Code.gs'
      - 'sales-todo.js'
      - 'tests/sales-todo-revision-history.test.cjs'
      - 'tests/sales-todo-revision-ui.test.cjs'
      - '.github/workflows/sales-todo-history-tests.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test task history and Audit Log recovery
        run: node --test tests/sales-todo-revision-history.test.cjs tests/sales-todo-revision-ui.test.cjs
