  <style>
    body{font-family:Inter,sans-serif;background:#fbfaf7;color:#1f2937}
    .font-serif{font-family:"Playfair Display",serif}
    .card{background:#fff;border:1px solid #eee8df;box-shadow:0 4px 18px rgba(0,0,0,.045)}
    .gold{color:#b38b2e}.bg-gold{background:#b38b2e}
    .sidebar-btn.active{background:#211d18;color:#fff}
    .sidebar-btn.active .nav-icon{color:#d8b04d}
    #desktopSidebar{width:16rem;transition:width .2s ease,padding .2s ease}
    #appMain{transition:margin-left .2s ease}
    #sidebarNav{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#d8d2c8 transparent}
    #sidebarNav::-webkit-scrollbar{width:6px}
    #sidebarNav::-webkit-scrollbar-thumb{background:#d8d2c8;border-radius:999px}
    .sidebar-compact-brand{
      display:none;
      width:40px;height:40px;border-radius:12px;
      align-items:center;justify-content:center;
      background:#211d18;color:#d8b04d;
      border:1px solid #cfae58;
      box-shadow:0 5px 14px rgba(33,29,24,.14);
      font-family:"Playfair Display",serif;
      font-size:15px;font-weight:800;letter-spacing:-.04em;
    }
    @media (min-width:1024px){
      body.sidebar-collapsed #desktopSidebar{width:4.5rem;padding-left:.5rem;padding-right:.5rem}
      body.sidebar-collapsed #appMain{margin-left:4.5rem!important}
      body.sidebar-collapsed .sidebar-full-brand,
      body.sidebar-collapsed .sidebar-label,
      body.sidebar-collapsed .sidebar-group-label,
      body.sidebar-collapsed .sidebar-chevron,
      body.sidebar-collapsed #sidebarUser,
      body.sidebar-collapsed .sidebar-signout-label{display:none!important}
      body.sidebar-collapsed .sidebar-header{position:relative;justify-content:center;align-items:center;padding:.8rem 0 1rem}
      body.sidebar-collapsed .sidebar-brand-wrap{width:100%;display:flex;justify-content:center}
      body.sidebar-collapsed .sidebar-compact-brand{display:flex}
      body.sidebar-collapsed #desktopSidebarToggle{
        position:absolute;right:-1rem;top:1.18rem;
        width:28px;height:28px;border-radius:9999px;
        background:#fff;border:1px solid #e2dbcf;
        box-shadow:0 3px 10px rgba(31,41,55,.12);
        z-index:2;
      }
      body.sidebar-collapsed #sidebarNav .sidebar-btn{justify-content:center;gap:0;padding-left:.5rem;padding-right:.5rem}
      body.sidebar-collapsed #sidebarNav .sidebar-group-header{justify-content:center;gap:0;padding-left:.5rem;padding-right:.5rem}
      body.sidebar-collapsed #sidebarNav .sidebar-group-panel{margin-left:0;padding-left:0;border-left:0}
      body.sidebar-collapsed #sidebarNav .nav-icon{width:1.5rem}
      body.sidebar-collapsed .sidebar-approval-badge{position:absolute;right:.15rem;top:.15rem;min-width:14px;height:14px;padding:0;font-size:7px}
      body.sidebar-collapsed #sidebarNav button{position:relative}
      body.sidebar-collapsed #sidebarFooter{padding-top:.75rem}
      body.sidebar-collapsed #sidebarFooter .sidebar-signout-btn{justify-content:center;padding-left:.5rem;padding-right:.5rem}
    }
    .modal-bg{background:rgba(20,18,15,.55);backdrop-filter:blur(4px)}
    .hidden-force{display:none!important}
  </style>

  <div id="loginScreen" class="hidden min-h-screen items-center justify-center p-5 bg-[#fbfaf7]">

      <form id="loginForm" class="space-y-4">
        <div><label class="text-xs font-semibold text-gray-600">Email</label><input id="loginEmail" type="email" required class="mt-1 w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#d6ba72]" placeholder="name@company.com"></div>
        <div><label class="text-xs font-semibold text-gray-600">Password</label><input id="loginPassword" type="password" minlength="8" required class="mt-1 w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#d6ba72]" placeholder="••••••••"></div>
        <button class="w-full bg-[#211d18] text-white rounded-xl py-3 font-semibold hover:bg-black">Sign In</button>
      </form>
      <p id="loginError" class="hidden mt-4 text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl p-3"></p>
    </div>
  </div>

  <div id="appShell" class="hidden min-h-screen">
    <aside id="desktopSidebar" class="fixed inset-y-0 left-0 bg-white border-r border-[#ece6dc] p-4 hidden lg:flex flex-col z-40">
      <div class="sidebar-header px-2 py-4 flex items-start justify-between gap-2 shrink-0">
        <div class="sidebar-brand-wrap min-w-0">
          <div class="sidebar-full-brand"><div class="font-serif text-2xl font-bold gold whitespace-nowrap">L'IMPERIAL</div><div class="text-[9px] tracking-[.22em] text-gray-400 whitespace-nowrap">ORDER MANAGEMENT</div></div>
          <button type="button" onclick="toggleDesktopSidebar()" class="sidebar-compact-brand" title="Expand L'IMPERIAL sidebar" aria-label="Expand sidebar">LI</button>
        </div>
        <button id="desktopSidebarToggle" type="button" onclick="toggleDesktopSidebar()" aria-label="Toggle sidebar" aria-expanded="true" title="Collapse sidebar" class="w-8 h-8 shrink-0 rounded-lg border border-[#e7e1d7] bg-white text-gray-500 hover:bg-gray-50 flex items-center justify-center text-lg leading-none">‹</button>
      </div>
      <nav id="sidebarNav" class="mt-2 space-y-1 flex-1 min-h-0 overflow-y-auto pr-1"></nav>
      <div id="sidebarFooter" class="border-t pt-4 shrink-0"><div id="sidebarUser" class="px-3 mb-3 text-xs text-gray-500"></div><button title="Sign Out" onclick="logout()" class="sidebar-signout-btn w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-gray-100"><span class="w-4 text-center shrink-0">⇥</span><span class="sidebar-signout-label">Sign Out</span></button></div>
    </aside>
    <main id="appMain" class="lg:ml-64 min-h-screen">
      <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-[#ece6dc]">
        <div class="px-4 md:px-7 h-16 flex items-center justify-between"><div><h1 id="pageTitle" class="text-lg md:text-xl font-bold">Dashboard</h1><p id="pageSubtitle" class="text-[11px] text-gray-400">Sales & Order Management</p></div><div class="flex items-center gap-2"><button onclick="openChangeMyPassword()" class="px-3 py-2 rounded-lg border bg-white text-xs font-semibold">My Password</button><button onclick="refreshCurrentPage()" class="px-3 py-2 rounded-lg border bg-white text-xs font-semibold">Refresh</button><button id="mobileMenuBtn" class="lg:hidden px-3 py-2 rounded-lg bg-[#211d18] text-white text-xs">Menu</button></div></div>
        <div id="mobileNav" class="hidden lg:hidden px-4 pb-3 bg-white border-t"></div>
      </header>
      <section id="content" class="p-4 md:p-7"></section>
    </main>
  </div>

  <div id="modal" class="hidden fixed inset-0 z-[80] modal-bg p-4 overflow-y-auto">
    <div class="max-w-4xl mx-auto my-8 bg-white rounded-2xl shadow-2xl overflow-hidden"><div class="px-6 py-4 bg-[#211d18] text-white flex justify-between items-center"><h3 id="modalTitle" class="font-serif text-xl"></h3><button onclick="closeModal()" class="text-2xl leading-none">&times;</button></div><div id="modalBody" class="p-6"></div></div>
  </div>
